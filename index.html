<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky_Strike_Overdrive - NYC Neon Chillx</title>
  <style>
    :root {
      --steam-blue: #1b2838;
      --steam-accent: #66c0f4;
      --steam-bg-dark: rgba(23, 26, 33, 0.9);
      --primary: #00fbff;
      --combo-color: #ffd700;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #020408;
      font-family: "Segoe UI", Arial, sans-serif;
      user-select: none;
      color: white;
    }

    /* Fixed logical resolution container (1280x720) – scaled as a single unit
       to fit any screen while preserving aspect ratio (letterbox/pillarbox).
       Everything – canvas AND all HUD/overlay DOM elements – lives inside this
       so they stay visually locked together at every screen size. */
    #gameRoot {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      transform-origin: 0 0;
      background: #020408;
    }

    /* Pixel-perfect sprite rendering */
    canvas {
      image-rendering: pixelated;
    }

    /* ================== HUD / MENU / OVERLAY ================== */

    #introScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a0e27 0%, #1a0033 50%, #0a0e27 100%);
      z-index: 1000;
      flex-direction: column;
      gap: 30px;
      padding: 20px;
      box-sizing: border-box;
    }

    #introScreen.hidden {
      display: none;
    }

    .intro-title {
      font-size: 3.5rem;
      font-weight: bold;
      background: linear-gradient(90deg, #00fbff, #ff006e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      text-shadow: 0 0 20px rgba(0, 251, 255, 0.5);
      letter-spacing: 2px;
      margin: 0;
    }

    .intro-subtitle {
      font-size: 1.2rem;
      color: #66c0f4;
      text-align: center;
      margin: 0;
      font-style: italic;
    }

    .intro-controls {
      text-align: center;
      font-size: 1rem;
      color: #aaa;
      max-width: 600px;
    }

    .intro-controls p {
      margin: 8px 0;
    }

    .intro-button-group {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .intro-btn {
      padding: 12px 30px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #00fbff;
      background: rgba(0, 251, 255, 0.1);
      color: #00fbff;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .intro-btn:hover {
      background: rgba(0, 251, 255, 0.3);
      box-shadow: 0 0 15px rgba(0, 251, 255, 0.6);
      transform: scale(1.05);
    }

    #pauseMenu {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 14, 39, 0.95);
      border: 3px solid #00fbff;
      padding: 40px;
      border-radius: 10px;
      text-align: center;
      z-index: 500;
      min-width: 300px;
      display: none;
      box-shadow: 0 0 30px rgba(0, 251, 255, 0.3);
    }

    #pauseMenu.visible {
      display: block;
    }

    #pauseMenu h2 {
      font-size: 2.5rem;
      color: #00fbff;
      margin: 0 0 20px 0;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .menu-button {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #66c0f4;
      background: rgba(102, 192, 244, 0.1);
      color: #66c0f4;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s;
      text-transform: uppercase;
    }

    .menu-button:hover {
      background: rgba(102, 192, 244, 0.3);
      box-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
    }

    /* ================== HUD ================== */

    #hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 100;
    }

    #score {
      position: absolute;
      top: 20px;
      left: 20px;
      font-size: 1.5rem;
      font-weight: bold;
      color: #00fbff;
      text-shadow: 0 0 10px rgba(0, 251, 255, 0.6);
      font-family: 'Courier New', monospace;
    }

    #lives {
      position: absolute;
      top: 20px;
      right: 20px;
      font-size: 1.2rem;
      color: #ff006e;
      text-shadow: 0 0 10px rgba(255, 0, 110, 0.6);
    }

    #level {
      position: absolute;
      top: 60px;
      left: 20px;
      font-size: 1rem;
      color: #66c0f4;
      font-family: 'Courier New', monospace;
    }

    #combo {
      position: absolute;
      top: 100px;
      left: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      color: #ffd700;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
      opacity: 0;
      transition: opacity 0.3s;
    }

    #combo.active {
      opacity: 1;
    }

    #pauseHint {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.9rem;
      color: #999;
      text-align: center;
    }

    .level-transition-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3rem;
      font-weight: bold;
      color: #00fbff;
      text-shadow: 0 0 20px rgba(0, 251, 255, 0.8);
      pointer-events: none;
      z-index: 200;
      text-align: center;
      animation: levelTransition 2s ease-in-out;
    }

    @keyframes levelTransition {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
    }

    /* ================== GAME OVER ================== */

    #gameOverScreen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.9), rgba(255, 0, 110, 0.1));
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 600;
      flex-direction: column;
      gap: 30px;
    }

    #gameOverScreen.visible {
      display: flex;
    }

    #gameOverScreen h1 {
      font-size: 4rem;
      color: #ff006e;
      text-shadow: 0 0 30px rgba(255, 0, 110, 0.8);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #finalScore {
      font-size: 2rem;
      color: #00fbff;
      text-shadow: 0 0 15px rgba(0, 251, 255, 0.6);
    }

    .game-over-btn {
      padding: 15px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border: 2px solid #00fbff;
      background: rgba(0, 251, 255, 0.1);
      color: #00fbff;
      cursor: pointer;
      border-radius: 5px;
      transition: all 0.3s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .game-over-btn:hover {
      background: rgba(0, 251, 255, 0.3);
      box-shadow: 0 0 20px rgba(0, 251, 255, 0.6);
      transform: scale(1.1);
    }

    /* Settings modal */
    #settingsModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #settingsModal.visible {
      display: flex;
    }

    .settings-content {
      background: #0a0e27;
      border: 2px solid #00fbff;
      padding: 30px;
      border-radius: 10px;
      max-width: 400px;
      box-shadow: 0 0 30px rgba(0, 251, 255, 0.3);
    }

    .settings-content h2 {
      color: #00fbff;
      text-align: center;
      margin-top: 0;
      font-size: 1.8rem;
      text-transform: uppercase;
    }

    .setting-group {
      margin: 20px 0;
    }

    .setting-group label {
      display: block;
      color: #66c0f4;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .control-option {
      display: flex;
      align-items: center;
      margin: 10px 0;
      cursor: pointer;
    }

    .control-option input[type="radio"] {
      margin-right: 10px;
      cursor: pointer;
      width: 18px;
      height: 18px;
    }

    .control-option label {
      margin: 0;
      cursor: pointer;
      color: #aaa;
    }

    #closeSettings {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #00fbff;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    #closeSettings:hover {
      background: #00e5e5;
    }

    /* Settings button */
    #settingsBtn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      background: rgba(102, 192, 244, 0.2);
      border: 2px solid #66c0f4;
      color: #66c0f4;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.9rem;
      pointer-events: auto;
      text-transform: uppercase;
      transition: all 0.3s;
    }

    #settingsBtn:hover {
      background: rgba(102, 192, 244, 0.4);
      box-shadow: 0 0 10px rgba(102, 192, 244, 0.5);
    }

    /* Leaderboard modal */
    #leaderboardModal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    #leaderboardModal.visible {
      display: flex;
    }

    .leaderboard-content {
      background: #0a0e27;
      border: 2px solid #ffd700;
      padding: 30px;
      border-radius: 10px;
      max-width: 500px;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
      max-height: 70vh;
      overflow-y: auto;
    }

    .leaderboard-content h2 {
      color: #ffd700;
      text-align: center;
      margin-top: 0;
      font-size: 2rem;
      text-transform: uppercase;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    .leaderboard-entry {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      border-bottom: 1px solid rgba(255, 215, 0, 0.2);
      font-size: 1rem;
      color: #66c0f4;
    }

    .leaderboard-entry.player-entry {
      background: rgba(0, 251, 255, 0.1);
      border: 1px solid #00fbff;
      border-radius: 3px;
      font-weight: bold;
    }

    .leaderboard-rank {
      min-width: 30px;
      color: #ffd700;
      font-weight: bold;
    }

    .leaderboard-name {
      flex-grow: 1;
      margin-left: 15px;
    }

    .leaderboard-score {
      text-align: right;
      min-width: 80px;
      color: #ffd700;
      font-weight: bold;
    }

    #closeLeaderboard {
      display: block;
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #ffd700;
      color: #000;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      font-size: 1.1rem;
      cursor: pointer;
      text-transform: uppercase;
    }

    #closeLeaderboard:hover {
      background: #ffed4e;
    }
  </style>
</head>
<body>

<div id="gameRoot">
  <canvas id="gameCanvas"></canvas>

  <!-- HUD Layer -->
  <div id="hud">
    <div id="score">SCORE: 0</div>
    <div id="lives">❤️ 3</div>
    <div id="level">LEVEL: 1 / 7</div>
    <div id="combo">COMBO x0</div>
    <div id="pauseHint">ESC to pause</div>
    <button id="settingsBtn">⚙️ SETTINGS</button>
  </div>

  <!-- Intro Screen -->
  <div id="introScreen">
    <h1 class="intro-title">SKY STRIKE OVERDRIVE</h1>
    <p class="intro-subtitle">NYC Neon Chillx</p>
    <div class="intro-controls">
      <p><strong>🎮 Controls:</strong></p>
      <p id="controlsInfo">Arrow Keys / WASD to move | Space to shoot</p>
      <p><strong>7 Levels</strong> | Battle Intense Waves</p>
    </div>
    <div class="intro-button-group">
      <button class="intro-btn" onclick="showSSOScreen()">▶ START GAME</button>
      <button class="intro-btn" onclick="showLeaderboard()">🏆 LEADERBOARD</button>
    </div>
  </div>

  <!-- Pause Menu -->
  <div id="pauseMenu">
    <h2>PAUSED</h2>
    <button class="menu-button" onclick="resumeGame()">Resume</button>
    <button class="menu-button" onclick="restartGame()">Restart</button>
    <button class="menu-button" onclick="showLeaderboard()">Leaderboard</button>
    <button class="menu-button" onclick="backToMenu()">Back to Menu</button>
  </div>

  <!-- Game Over Screen -->
  <div id="gameOverScreen">
    <h1>GAME OVER</h1>
    <div id="finalScore">Final Score: 0</div>
    <button class="game-over-btn" onclick="restartGame()">Play Again</button>
    <button class="game-over-btn" onclick="backToMenu()">Main Menu</button>
  </div>

  <!-- Settings Modal -->
  <div id="settingsModal">
    <div class="settings-content">
      <h2>Settings</h2>
      <div class="setting-group">
        <label>🎮 Control Scheme</label>
        <div class="control-option">
          <input type="radio" name="controlScheme" value="arrows" id="scheme-arrows" checked>
          <label for="scheme-arrows">Arrow Keys</label>
        </div>
        <div class="control-option">
          <input type="radio" name="controlScheme" value="wasd" id="scheme-wasd">
          <label for="scheme-wasd">WASD</label>
        </div>
        <div class="control-option">
          <input type="radio" name="controlScheme" value="mouse" id="scheme-mouse">
          <label for="scheme-mouse">Mouse / Touch</label>
        </div>
      </div>
      <button id="closeSettings">Close</button>
    </div>
  </div>

  <!-- Leaderboard Modal -->
  <div id="leaderboardModal">
    <div class="leaderboard-content">
      <h2>🏆 Leaderboard</h2>
      <div id="leaderboardList"></div>
      <button id="closeLeaderboard">Close</button>
    </div>
  </div>
</div>

<script>

// ============= SPRITE SHEET SYSTEM =============
const shipSpriteSheet = new Image();
shipSpriteSheet.src = 'ships_spritesheet_transparent_update.png'; // ✅ OPRAVENO - správný název souboru
let spritesLoaded = false;

shipSpriteSheet.onload = () => {
  spritesLoaded = true;
  console.log('✅ Sprite sheet loaded!');
};

// Sprite sheet configuration
const SPRITE_CONFIG = {
  width: 704,
  height: 153.6,
  rows: {
    'single': 0,
    'spread': 1,
    'rapid': 2,
    'heavy': 3,
    'dual': 4
  }
}

// ============= CANVAS / RENDER SETUP =============
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d', { alpha: false });

// Fixed game resolution
const GAME_WIDTH = 1280;
const GAME_HEIGHT = 720;
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

// Scale to fit screen
function resize() {
  const gameRoot = document.getElementById('gameRoot');
  const w = window.innerWidth;
  const h = window.innerHeight;
  
  const scaleW = w / GAME_WIDTH;
  const scaleH = h / GAME_HEIGHT;
  const scale = Math.min(scaleW, scaleH);
  
  const scaledW = GAME_WIDTH * scale;
  const scaledH = GAME_HEIGHT * scale;
  
  gameRoot.style.width = scaledW + 'px';
  gameRoot.style.height = scaledH + 'px';
  gameRoot.style.left = ((w - scaledW) / 2) + 'px';
  gameRoot.style.top = ((h - scaledH) / 2) + 'px';
}

window.addEventListener('resize', resize);
resize();

// ============= INPUT HANDLING =============
let keys = {};

// KEYBOARD input
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    const intro = document.getElementById('introScreen');
    if (intro.style.display === 'none') {
      if (gameActive) togglePause();
    }
    return;
  }
  
  if (typeof gameStarted !== 'undefined' && gameStarted && gameActive) {
    if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
      e.preventDefault();
    }
  }
  keys[e.key.toLowerCase()] = true;
});

window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// ✅ TOUCH/MOUSE input pro mobilní ovládání
let touchPos = null;
let mousePos = null;

// Mouse tracking pro desktop/tablet
document.addEventListener('mousemove', e => {
  const gameRoot = document.getElementById('gameRoot');
  const rect = gameRoot.getBoundingClientRect();
  const scale = rect.width / GAME_WIDTH;
  
  mousePos = {
    x: (e.clientX - rect.left) / scale,
    y: (e.clientY - rect.top) / scale
  };
});

// Touch tracking pro mobil
document.addEventListener('touchmove', e => {
  if (e.touches.length > 0) {
    const gameRoot = document.getElementById('gameRoot');
    const rect = gameRoot.getBoundingClientRect();
    const scale = rect.width / GAME_WIDTH;
    
    const touch = e.touches[0];
    touchPos = {
      x: (touch.clientX - rect.left) / scale,
      y: (touch.clientY - rect.top) / scale
    };
  }
}, { passive: true });

document.addEventListener('touchend', e => {
  touchPos = null;
}, { passive: true });

// Get player input (keyboard OR touch/mouse)
function getPlayerInput() {
  const controlScheme = localStorage.getItem('controlScheme') || 'arrows';
  
  const input = {
    up: false,
    down: false,
    left: false,
    right: false,
    shoot: false
  };
  
  if (controlScheme === 'arrows') {
    input.up = keys['arrowup'];
    input.down = keys['arrowdown'];
    input.left = keys['arrowleft'];
    input.right = keys['arrowright'];
    input.shoot = keys[' '];
  } else if (controlScheme === 'wasd') {
    input.up = keys['w'];
    input.down = keys['s'];
    input.left = keys['a'];
    input.right = keys['d'];
    input.shoot = keys[' '];
  } else if (controlScheme === 'mouse') {
    // Na mobilu je to touch, na desktopu je to mouse
    const pos = touchPos || mousePos;
    if (pos && player) {
      const dx = pos.x - player.x;
      const dy = pos.y - player.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist > 10) {
        const angle = Math.atan2(dy, dx);
        input.up = dy < -20;
        input.down = dy > 20;
        input.left = dx < -20;
        input.right = dx > 20;
      }
      input.shoot = true; // Continuous shooting with mouse
    }
  }
  
  return input;
}

// ============= GAME STATE =============
let gameStarted = false;
let gameActive = false;
let score = 0;
let lives = 3;
let currentLevel = 1;
let combo = 0;
let gameSpeedMult = 0.85;
let shake = 0;

// Player
let player = {
  x: GAME_WIDTH / 2,
  y: GAME_HEIGHT - 60,
  width: 24,
  height: 24,
  speed: 4,
  shipType: 'single',
  bullets: [],
  maxHealth: 100,
  health: 100,
  invulnerable: false,
  invulnerableTime: 0
};

// Enemies and bullets
let enemies = [];
let enemyBullets = [];
let particles = [];

// ============= GAME LOOP =============
const BASE_FPS = 60;
let lastTime = performance.now();
let score = 0, lives = 3, fuel = 100, gameActive = true;
let isNight = true;
let powerupType = null, powerupTimer = 0;
let gameSpeedMult = 0.85;
let shake = 0;

function gameLoop() {
  const now = performance.now();
  const deltaTime = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  
  if (!gameActive || !gameStarted) {
    requestAnimationFrame(gameLoop);
    return;
  }
  
  // Update game state
  updateGame(deltaTime);
  
  // Render
  render();
  
  requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
  if (!player) return;
  
  const input = getPlayerInput();
  
  // Update player
  if (input.up && player.y > 10) player.y -= player.speed;
  if (input.down && player.y < GAME_HEIGHT - 40) player.y += player.speed;
  if (input.left && player.x > 15) player.x -= player.speed;
  if (input.right && player.x < GAME_WIDTH - 15) player.x += player.speed;
  
  if (input.shoot) {
    player.lastShot = (player.lastShot || 0) - dt;
    if (player.lastShot < 0) {
      createPlayerBullets();
      player.lastShot = 0.15;
    }
  }
  
  // Update bullets
  player.bullets = player.bullets.filter(b => {
    b.y -= b.speed;
    return b.y > 0;
  });
  
  enemyBullets = enemyBullets.filter(b => {
    b.x += b.vx;
    b.y += b.vy;
    return b.y < GAME_HEIGHT && b.x > 0 && b.x < GAME_WIDTH;
  });
  
  // Update enemies
  enemies.forEach(e => {
    e.y += e.speed;
    e.shotTimer -= dt;
    
    if (e.shotTimer < 0) {
      createEnemyBullets(e);
      e.shotTimer = e.shootInterval;
    }
  });
  
  enemies = enemies.filter(e => e.y < GAME_HEIGHT + 100);
  
  // Collision detection
  checkCollisions();
  
  // Update particles
  particles = particles.filter(p => {
    p.life -= dt;
    return p.life > 0;
  });
  
  // Update invulnerability
  if (player.invulnerable) {
    player.invulnerableTime -= dt;
    if (player.invulnerableTime <= 0) {
      player.invulnerable = false;
    }
  }
  
  // Shake effect
  if (shake > 0) shake -= dt;
  
  // Spawn new enemies
  updateEnemyWaves();
}

function render() {
  // Apply shake
  const shakeX = shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  const shakeY = shake > 0 ? (Math.random() - 0.5) * 4 : 0;
  
  ctx.save();
  ctx.translate(shakeX, shakeY);
  
  // Clear canvas
  ctx.fillStyle = '#020408';
  ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);
  
  // Draw stars
  drawStars();
  
  // Draw enemies
  enemies.forEach(e => drawEnemy(e));
  
  // Draw enemy bullets
  enemyBullets.forEach(b => {
    ctx.fillStyle = '#ff3366';
    ctx.fillRect(b.x - 2, b.y - 2, 4, 4);
  });
  
  // Draw player bullets
  player.bullets.forEach(b => {
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(b.x - 1, b.y - 3, 2, 6);
  });
  
  // Draw player
  if (!player.invulnerable || Math.floor(player.invulnerableTime * 10) % 2) {
    drawPlayer();
  }
  
  // Draw particles
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 1;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  
  ctx.restore();
  
  // Update HUD
  document.getElementById('score').textContent = 'SCORE: ' + score;
  document.getElementById('lives').textContent = '❤️ ' + lives;
  document.getElementById('level').textContent = 'LEVEL: ' + currentLevel + ' / 7';
  
  if (combo > 0) {
    document.getElementById('combo').textContent = 'COMBO x' + combo;
    document.getElementById('combo').classList.add('active');
  } else {
    document.getElementById('combo').classList.remove('active');
  }
}

function drawPlayer() {
  if (!spritesLoaded) {
    ctx.fillStyle = '#00ff88';
    ctx.fillRect(player.x - 12, player.y - 12, 24, 24);
    return;
  }
  
  const srcY = SPRITE_CONFIG.rows[player.shipType] * SPRITE_CONFIG.height;
  ctx.drawImage(shipSpriteSheet, 0, srcY, SPRITE_CONFIG.width, SPRITE_CONFIG.height, 
                player.x - 30, player.y - 25, 60, 50);
}

function drawEnemy(e) {
  ctx.fillStyle = e.color || '#ff6600';
  ctx.fillRect(e.x - 15, e.y - 15, 30, 30);
}

function drawStars() {
  ctx.fillStyle = 'rgba(0, 251, 255, 0.3)';
  for (let i = 0; i < 100; i++) {
    const x = (i * 137) % GAME_WIDTH;
    const y = (i * 73) % GAME_HEIGHT;
    ctx.fillRect(x, y, 1, 1);
  }
}

function createPlayerBullets() {
  if (player.shipType === 'single') {
    player.bullets.push({ x: player.x, y: player.y, speed: 8 });
  } else if (player.shipType === 'spread') {
    player.bullets.push({ x: player.x - 8, y: player.y, speed: 8, vx: -1 });
    player.bullets.push({ x: player.x, y: player.y, speed: 8, vx: 0 });
    player.bullets.push({ x: player.x + 8, y: player.y, speed: 8, vx: 1 });
  }
}

function createEnemyBullets(e) {
  const dx = player.x - e.x;
  const dy = player.y - e.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  
  enemyBullets.push({
    x: e.x,
    y: e.y,
    vx: (dx / dist) * 3,
    vy: (dy / dist) * 3
  });
}

function checkCollisions() {
  // Player bullets vs enemies
  player.bullets = player.bullets.filter(bullet => {
    let hit = false;
    enemies = enemies.filter(e => {
      if (Math.abs(bullet.x - e.x) < 20 && Math.abs(bullet.y - e.y) < 20) {
        hit = true;
        score += 10;
        combo++;
        createExplosion(e.x, e.y);
        shake = 0.1;
        return false;
      }
      return true;
    });
    return !hit;
  });
  
  // Enemy bullets vs player
  if (!player.invulnerable) {
    enemyBullets = enemyBullets.filter(b => {
      if (Math.abs(b.x - player.x) < 20 && Math.abs(b.y - player.y) < 20) {
        lives--;
        player.invulnerable = true;
        player.invulnerableTime = 2;
        createExplosion(player.x, player.y);
        shake = 0.3;
        combo = 0;
        
        if (lives <= 0) {
          gameActive = false;
          showGameOver();
        }
        return false;
      }
      return true;
    });
  }
}

function createExplosion(x, y) {
  for (let i = 0; i < 10; i++) {
    particles.push({
      x: x,
      y: y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4,
      size: Math.random() * 3 + 1,
      color: Math.random() > 0.5 ? '#ff3366' : '#ffaa00',
      life: 0.5
    });
  }
}

function updateEnemyWaves() {
  if (enemies.length === 0 && !waveTimer) {
    waveTimer = 1;
  }
  
  if (waveTimer) {
    waveTimer -= 0.016;
    if (waveTimer <= 0) {
      if (currentLevel <= 7) {
        spawnWave(currentLevel);
        if (enemies.length > 0) {
          currentLevel++;
        }
      } else {
        gameActive = false;
        showGameOver();
      }
      waveTimer = null;
    }
  }
}

function spawnWave(level) {
  const count = Math.min(3 + level, 10);
  for (let i = 0; i < count; i++) {
    enemies.push({
      x: Math.random() * GAME_WIDTH,
      y: -30,
      speed: 1 + level * 0.2,
      color: '#ff' + Math.floor(Math.random() * 255).toString(16).padStart(2, '0') + '00',
      shotTimer: 2,
      shootInterval: 2
    });
  }
}

let waveTimer = null;

function togglePause() {
  gameActive = !gameActive;
  document.getElementById('pauseMenu').classList.toggle('visible', !gameActive);
}

function resumeGame() {
  gameActive = true;
  document.getElementById('pauseMenu').classList.remove('visible');
}

function restartGame() {
  document.getElementById('gameOverScreen').classList.remove('visible');
  document.getElementById('pauseMenu').classList.remove('visible');
  
  score = 0;
  lives = 3;
  currentLevel = 1;
  combo = 0;
  gameActive = true;
  gameStarted = true;
  
  player = {
    x: GAME_WIDTH / 2,
    y: GAME_HEIGHT - 60,
    width: 24,
    height: 24,
    speed: 4,
    shipType: 'single',
    bullets: [],
    maxHealth: 100,
    health: 100,
    invulnerable: false,
    invulnerableTime: 0
  };
  
  enemies = [];
  enemyBullets = [];
  particles = [];
  waveTimer = 0.5;
}

function showGameOver() {
  document.getElementById('finalScore').textContent = 'Final Score: ' + score;
  document.getElementById('gameOverScreen').classList.add('visible');
}

function backToMenu() {
  document.getElementById('introScreen').style.display = 'flex';
  document.getElementById('gameOverScreen').classList.remove('visible');
  document.getElementById('pauseMenu').classList.remove('visible');
  gameStarted = false;
  gameActive = false;
}

function showSSOScreen() {
  document.getElementById('introScreen').style.display = 'none';
  restartGame();
}

function showLeaderboard() {
  const lb = JSON.parse(localStorage.getItem('leaderboard') || '[]');
  const html = lb.map((e, i) => 
    `<div class="leaderboard-entry">
      <span class="leaderboard-rank">#${i+1}</span>
      <span class="leaderboard-name">${e.name}</span>
      <span class="leaderboard-score">${e.score}</span>
    </div>`
  ).join('');
  
  document.getElementById('leaderboardList').innerHTML = html || '<div style="color: #aaa; text-align: center; padding: 20px;">No scores yet!</div>';
  document.getElementById('leaderboardModal').classList.add('visible');
}

// Settings
document.getElementById('settingsBtn').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.add('visible');
});

document.getElementById('closeSettings').addEventListener('click', () => {
  document.getElementById('settingsModal').classList.remove('visible');
  const scheme = document.querySelector('input[name="controlScheme"]:checked').value;
  localStorage.setItem('controlScheme', scheme);
});

document.getElementById('closeLeaderboard').addEventListener('click', () => {
  document.getElementById('leaderboardModal').classList.remove('visible');
});

// Start loop
gameLoop();

</script>

</body>
</html>
